# Render Blueprint. Commit this and Render can set the service up from it.
# DATABASE_URL is intentionally NOT here — set it as a secret in the dashboard.
services:
  - type: web
    name: creditvox
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: CREDIT_PROVIDER
        value: bureau_mock
      - key: CORS_ORIGINS
        value: https://bravoxcredit.com,https://www.bravoxcredit.com
      - key: DISCLOSURE_VERSION
        value: 2026-01-v1
      - key: CONSENT_TTL_MINUTES
        value: "30"
      - key: DATABASE_URL
        sync: false   # secret — paste the Neon connection string in the dashboard
